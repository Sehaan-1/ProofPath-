[build-system]
requires = ["hatchling>=1.33.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "proofpath"
version = "0.1.0"
description = "ProofPath — Personal Evidence & Opportunity Agent"
requires-python = ">=3.11"
dependencies = [
    # API & validation
    "fastapi>=0.165.0,<0.166.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
    "pydantic>=2.14.4,<3.0.0",
    "pydantic-settings>=2.16.3,<3.0.0",
    # Database, migrations & vector search
    "sqlalchemy[asyncio]>=2.1.9,<3.0.0",
    "asyncpg>=0.32.0,<0.33.0",
    "alembic>=1.20.1,<2.0.0",
    "pgvector>=0.5.1,<0.6.0",
    # Agent orchestration & durable Postgres checkpointing
    "langgraph>=1.2.24,<2.0.0",
    "langgraph-checkpoint-postgres>=3.2.1,<4.0.0",
    "psycopg[binary]>=3.3.9,<4.0.0",
    # Model Context Protocol, HTTP client & async queue
    "mcp>=2.3.0,<3.0.0",
    "httpx>=0.29.0,<0.30.0",
    "redis>=8.2.0,<9.0.0",
    # LLM & embedding SDK (OpenAI; 2.x retains httpx compatibility with respx and guardrails-ai)
    "openai>=2.54.0,<3.0.0",
    "langchain-openai>=1.8.5,<2.0.0",
]

[project.optional-dependencies]
# Heavy or conflict-prone libraries stay isolated from the core runtime so
# Pydantic / OpenTelemetry constraints never break core installation.
evals = [
    "giskard>=2.19.2,<3.0.0; python_version < '3.12'",
    "giskard>=3.0.1,<4.0.0; python_version >= '3.12'",
]
guardrails = [
    "guardrails-ai>=0.11.0,<0.12.0",
]
e2e = [
    "playwright>=1.65.2,<2.0.0",
    "pytest-playwright>=0.10.0,<0.11.0",
]
dev = [
    "ruff>=0.17.6,<0.18.0",
    "mypy>=2.4.1,<3.0.0",
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.5.0,<2.0.0",
    "respx>=0.23.1,<0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proofpath"]

# ---------------------------------------------------------------------------
# Ruff (linter & formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T20",   # flake8-print
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501", # Handled by ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["proofpath"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "PT011"]
"evals/**" = ["T201"]
"migrations/**" = ["E501", "F401", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy (static type checking)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/proofpath"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest & pytest-asyncio
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Fast, isolated unit tests (may use respx for HTTP edge cases)",
    "integration: Live service-backed integration tests (PostgreSQL/pgvector, Redis, MCP)",
    "e2e: End-to-end browser tests requiring the isolated e2e extra (Playwright)",
    "eval: Golden dataset and adversarial red-teaming evaluation tests",
    "live: Tests requiring external live API keys (OpenAI, GitHub)",
]
